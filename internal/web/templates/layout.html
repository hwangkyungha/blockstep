{{define "layout"}}<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blockstep - {{template "title" .}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="top">
  <a class="logo" href="/">Blockstep</a>
  <nav>
    <a href="/"{{if eq .Nav "scenarios"}} class="active"{{end}}>시나리오</a>
    <a href="/issues"{{if eq .Nav "issues"}} class="active"{{end}}>이슈</a>
    <a href="/settings"{{if eq .Nav "settings"}} class="active"{{end}}>설정</a>
  </nav>
</header>
<main>
{{template "content" .}}
</main>
{{with .People}}<script type="application/json" id="combo-people">{{json .}}</script>{{end}}
{{with .Packages}}<script type="application/json" id="combo-packages">{{json .}}</script>{{end}}
<script src="/static/combo.js"></script>
</body>
</html>{{end}}
