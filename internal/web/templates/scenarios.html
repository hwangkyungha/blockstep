{{define "title"}}시나리오 목록{{end}}
{{define "content"}}
<h1>시나리오 목록</h1>
{{if .Scenarios}}
<table>
  <thead><tr><th>이름</th><th>설명</th></tr></thead>
  <tbody>
  {{range .Scenarios}}
  <tr><td><a href="/scenarios/{{.ID}}">{{.Name}}</a></td><td>{{.Description}}</td></tr>
  {{end}}
  </tbody>
</table>
{{else}}
<p>아직 시나리오가 없습니다.</p>
{{end}}

<h2>시나리오 만들기</h2>
<form method="post" action="/scenarios">
  <label>이름 <input name="name" required></label>
  <label>설명 <textarea name="description" rows="3"></textarea></label>
  <button type="submit">만들기</button>
</form>
{{end}}
